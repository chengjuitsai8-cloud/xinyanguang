<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7c86">
  <meta name="robots" content="noindex, nofollow">
  <title>新眼光｜白內障手術，重見新光</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="#fff" opacity=".18"/>
        <path d="M4 20c4-7 9.5-10.500 16-10.500S32 13 36 20c-4 7-9.500 10.500-16 10.500S8 27 4 20z" fill="#fff"/>
        <circle cx="20" cy="20" r="6.500" fill="#0e7c86"/>
        <circle cx="22" cy="18" r="2" fill="#fff"/>
      </svg>
      <div class="titles">
        <h1 id="appTitle">新眼光</h1>
        <div class="sub" id="appSub">白內障手術</div>
      </div>
      <button class="icon-btn" data-act="read-page" id="readBtn" aria-label="朗讀這一頁">朗讀</button>
      <button class="icon-btn" data-act="toggle-font" id="fontBtn" aria-label="切換大字體">大字</button>
      <button class="icon-btn" data-act="go" data-view="doctor" id="docBtn" aria-label="醫師設定">醫師</button>
    </header>

    <main id="view" aria-live="polite"></main>
  </div>

  <nav class="tabbar" aria-label="主要功能">
    <div class="in" id="tabs"></div>
  </nav>

  <div id="overlay"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
